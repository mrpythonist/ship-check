version: 1

project:
  name: my-saas
  environment: production

verification:
  timeout: 30s
  parallel: true
  fail_fast: false

checks:
  http:
    enabled: true
    endpoints:
      - name: API Health
        url: https://example.com/api/health
        expected_status: 200
        timeout: 5s
        max_response_time_ms: 2000
        body_contains: "ok"
        check_tls: true
        tls_min_days: 14

  database:
    enabled: true
    driver: postgres
    dsn: ${DATABASE_URL}
    timeout: 5s

  redis:
    enabled: true
    address: 127.0.0.1:6379
    timeout: 5s

  docker:
    enabled: true
    socket: /var/run/docker.sock
    require_health: true
    containers:
      - name: my-saas-app
        max_restarts: 3

  workers:
    enabled: true
    processes:
      - name: Queue Worker
        pattern: "queue:work"
        min_count: 1
    heartbeat_file: /var/www/my-saas/storage/worker-heartbeat.txt
    heartbeat_max_age: 5m
    queues:
      - name: default
        address: 127.0.0.1:6379
        key: "queues:default"
        max_length: 100

  system:
    enabled: true
    disk_path: /
    disk_max_usage_percent: 90
    memory_max_usage_percent: 90
    max_load_1m: 4.0

reporting:
  format: terminal
  verbose: false
